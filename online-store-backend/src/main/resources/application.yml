spring:
  application:
    name: online-store
  datasource:
    url: jdbc:postgresql://localhost:5432/online_store_db
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # create, create-drop, update, validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
